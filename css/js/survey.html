<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Political Survey</title>

<link rel="stylesheet" href="../style.css">
</head>

<body>

<div class="login-container">

<h2>Political Survey Form</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="number" id="age" placeholder="Age">

<select id="gender">
    <option value="">Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
</select>

<input type="text" id="village" placeholder="Village / City">

<input type="text" id="assembly" placeholder="Assembly Constituency">

<select id="party">
    <option value="">Select Political Party</option>
    <option value="BJP">BJP</option>
    <option value="Congress">Congress</option>
    <option value="AAP">AAP</option>
    <option value="BSP">BSP</option>
    <option value="SP">SP</option>
    <option value="Other">Other</option>
</select>

<input type="text" id="candidate" placeholder="Candidate Name">

<textarea id="feedback" placeholder="Write your feedback"></textarea>

<button id="submitSurvey">Submit Survey</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="survey.js"></script>

</body>
</html>
